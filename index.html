<style>
:root{
  --navy:#0b0f1a;
  --navy2:#111729;
  --panel:#151c2f;
  --panel2:#1b2340;
  --border:#2a3454;
  --text:#e8ecf7;
  --dim:#8b93ac;
  --franklin:#3ddc84;
  --michael:#3d9bdc;
  --trevor:#dc7a3d;
  --gold:#e0b64a;
  --plat:#c9d6ff;
  --danger:#e0546a;
}
*{box-sizing:border-box;}
html{
  background:var(--navy);
  height:100%;
}
body{
  margin:0;
  background:radial-gradient(1200px 800px at 20% -10%, #16203c 0%, var(--navy) 55%);
  background-color:var(--navy);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  min-height:100vh;
  min-height:100dvh;
  padding-top:env(safe-area-inset-top);
}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 80px;}

.hero{
  background:linear-gradient(135deg,var(--panel) 0%, var(--panel2) 100%);
  border:1px solid var(--border);
  border-radius:16px;
  padding:22px 22px 18px;
  margin-bottom:16px;
  box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
}
.hero h1{
  margin:0 0 4px;
  font-size:22px;
  letter-spacing:.5px;
  background:linear-gradient(90deg,var(--franklin),var(--michael),var(--trevor));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  font-weight:800;
}
.hero .sub{color:var(--dim);font-size:13px;margin-bottom:16px;}

.progress-outer{
  background:#0a0e18;
  border:1px solid var(--border);
  border-radius:999px;
  height:22px;
  overflow:hidden;
  position:relative;
}
.progress-inner{
  height:100%;
  background:linear-gradient(90deg,var(--franklin),var(--michael),var(--trevor));
  transition:width .3s ease;
  border-radius:999px;
}
.progress-label{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:700;letter-spacing:.5px;
  text-shadow:0 1px 2px rgba(0,0,0,.6);
}
.stats-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
.stat{
  flex:1;min-width:110px;
  background:var(--navy2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:8px 10px;
}
.stat .n{font-size:18px;font-weight:800;}
.stat .l{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;}

.controls{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;
}
.sync-row{
  display:flex;align-items:center;gap:10px;margin-top:12px;
}
.sync-status{
  font-size:11px;color:var(--dim);flex:1;
}
.sync-status.synced{color:var(--franklin);}
.sync-status.syncing{color:var(--michael);}
.sync-status.error, .sync-status.offline{color:var(--gold);}
#syncNowBtn{padding:6px 12px;font-size:11.5px;}
.controls input[type=text]{
  flex:1;min-width:160px;
  background:var(--navy2);
  border:1px solid var(--border);
  color:var(--text);
  padding:9px 12px;
  border-radius:9px;
  font-size:13px;
  outline:none;
}
.controls input[type=text]:focus{border-color:var(--michael);}
.btn{
  background:var(--navy2);
  border:1px solid var(--border);
  color:var(--text);
  padding:9px 13px;
  border-radius:9px;
  font-size:12.5px;
  cursor:pointer;
  white-space:nowrap;
  transition:.15s;
}
.btn:hover{border-color:var(--michael);background:#1c2744;}
.btn.active{background:var(--michael);border-color:var(--michael);color:#06101f;font-weight:700;}
.btn.danger:hover{border-color:var(--danger);}

.chapter{
  margin-bottom:14px;
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  background:var(--panel);
}
.chapter-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;
  cursor:pointer;
  user-select:none;
  background:linear-gradient(90deg,var(--panel2),var(--panel));
}
.chapter-head:hover{background:#1c2744;}
.chapter-title{font-size:14.5px;font-weight:800;letter-spacing:.3px;}
.chapter-title .num{color:var(--gold);margin-right:8px;}
.chapter-sub{font-size:11px;color:var(--dim);margin-top:2px;font-weight:400;}
.chapter-meta{display:flex;align-items:center;gap:10px;}
.chapter-bar{
  width:70px;height:6px;border-radius:99px;background:#0a0e18;overflow:hidden;border:1px solid var(--border);
}
.chapter-bar-inner{height:100%;background:linear-gradient(90deg,var(--franklin),var(--michael));}
.chapter-count{font-size:11px;color:var(--dim);min-width:48px;text-align:right;}
.chevron{transition:transform .2s;color:var(--dim);}
.chapter.open .chevron{transform:rotate(90deg);}

.chapter-body{display:none;padding:4px 12px 12px;}
.chapter.open .chapter-body{display:block;}

.part-block{margin-top:10px;}
.part-label{
  font-size:11px;font-weight:700;color:var(--dim);
  text-transform:uppercase;letter-spacing:.8px;
  padding:6px 6px 4px;
  border-bottom:1px solid var(--border);
  margin-bottom:4px;
}

.task{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:9px 8px;
  border-radius:9px;
  transition:.12s;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.task:hover{background:#182036;}
.task:active{background:#1f2a48;}
.task.done{opacity:.45;}
.task.flagged{background:rgba(224,182,74,.07);}
.flag-btn{cursor:pointer;}

.check{
  flex:0 0 auto;
  width:20px;height:20px;
  border-radius:6px;
  border:2px solid var(--border);
  margin-top:2px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:.12s;
  background:var(--navy2);
}
.check.on{
  background:linear-gradient(135deg,var(--franklin),var(--michael));
  border-color:transparent;
}
.check svg{width:12px;height:12px;display:none;stroke:#06101f;stroke-width:3;}
.check.on svg{display:block;}

.task-main{flex:1;min-width:0;}
.task-name{
  font-size:13.5px;font-weight:600;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
}
.task-name.done{text-decoration:line-through;}
.char-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
.char-F{background:var(--franklin);}
.char-M{background:var(--michael);}
.char-T{background:var(--trevor);}
.char-{background:var(--dim);}

.badge{
  font-size:9px;font-weight:700;
  padding:2px 6px;
  border-radius:5px;
  text-transform:uppercase;
  letter-spacing:.4px;
  border:1px solid var(--border);
  color:var(--dim);
}
.badge.opt{color:var(--gold);border-color:rgba(224,182,74,.4);background:rgba(224,182,74,.08);}
.badge.cat{color:var(--plat);border-color:rgba(201,214,255,.3);background:rgba(201,214,255,.06);}

.task-loc{font-size:11.5px;color:var(--dim);margin-top:2px;}
.task-note{font-size:11.5px;color:#a9b1c9;margin-top:3px;line-height:1.4;}

.flag-btn{
  flex:0 0 auto;
  width:26px;height:26px;
  border-radius:7px;
  border:1px solid var(--border);
  background:var(--navy2);
  color:var(--dim);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;
  transition:.12s;
}
.flag-btn:hover{border-color:var(--gold);}
.flag-btn.on{background:rgba(224,182,74,.15);border-color:var(--gold);color:var(--gold);}

.empty-msg{
  text-align:center;color:var(--dim);padding:40px 20px;font-size:13px;
}

.legend{
  display:flex;gap:14px;flex-wrap:wrap;margin:14px 2px 0;font-size:11px;color:var(--dim);
}
.legend span{display:flex;align-items:center;gap:5px;}
.legend .dot{width:8px;height:8px;border-radius:50%;}

::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}

@media(max-width:520px){
  .hero h1{font-size:18px;}
  .task-name{font-size:12.5px;}
  .chapter-title{font-size:13px;}
}
</style>
</head>

let filterMode = 'all';

const SUPABASE_URL = 'https://einodrrumonmokcpeswi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpbm9kcnJ1bW9ubW9rY3Blc3dpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0Mjk0NDgsImV4cCI6MjEwMTAwNTQ0OH0.mb-pM_UmDVJYsAo6U73fKOqeJbCbNpKL5zNgVDSt0qo';
const REST_URL = SUPABASE_URL + '/rest/v1/tracker_state';
const ROW_ID = 'gta5-main';
const SB_HEADERS = {
  'apikey': SUPABASE_ANON_KEY,
  'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
  'Content-Type': 'application/json'
};

let syncStatus = 'idle'; // idle | syncing | synced | offline | error
let saveTimer = null;

function setSyncStatus(s){
  syncStatus = s;
  const el = document.getElementById('syncStatus');
  if(!el) return;
  const map = {
    idle:'', syncing:'Syncing…', synced:'Synced', offline:'Offline — saved on this device', error:'Sync failed — saved on this device'
  };
  el.textContent = map[s] || '';
  el.className = 'sync-status ' + s;
}

async function fetchRemoteState(){
  const res = await fetch(`${REST_URL}?id=eq.${ROW_ID}&select=data`, { headers: SB_HEADERS });
  if(!res.ok) throw new Error('fetch failed: ' + res.status);
  const rows = await res.json();
  if(rows && rows.length) return rows[0].data;
  return null;
}

async function pushRemoteState(){
  const res = await fetch(REST_URL, {
    method: 'POST',
    headers: { ...SB_HEADERS, 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify([{ id: ROW_ID, data: state, updated_at: new Date().toISOString() }])
  });
  if(!res.ok) throw new Error('push failed: ' + res.status);
}

function saveState(){
  // Always cache locally first so nothing is lost if offline
  try{ localStorage.setItem('gta5-tracker-state', JSON.stringify(state)); }catch(e){}

  clearTimeout(saveTimer);
  setSyncStatus('syncing');
  saveTimer = setTimeout(async ()=>{
    try{
      await pushRemoteState();
      setSyncStatus('synced');
    }catch(e){
      console.error('sync push failed', e);
      setSyncStatus(navigator.onLine ? 'error' : 'offline');
    }
  }, 600);
}

async function syncNow(){
  setSyncStatus('syncing');
  try{
    const remote = await fetchRemoteState();
    if(remote){ state = remote; }
    try{ localStorage.setItem('gta5-tracker-state', JSON.stringify(state)); }catch(e){}
    render();
    setSyncStatus('synced');
  }catch(e){
    console.error('manual sync failed', e);
    setSyncStatus(navigator.onLine ? 'error' : 'offline');
  }
}

async function loadState(){
  // Start from local cache immediately so the UI isn't blank while we fetch
  try{
    const raw = localStorage.getItem('gta5-tracker-state');
    if(raw) state = JSON.parse(raw);
  }catch(e){ state = {}; }

  let bulkFlag = null;
  try{ bulkFlag = localStorage.getItem('gta5-tracker-bulk-ch2f-v1'); }catch(e){}

  render();

  try{
    setSyncStatus('syncing');
    const remote = await fetchRemoteState();
    if(remote){
      state = remote;
      try{ localStorage.setItem('gta5-tracker-state', JSON.stringify(state)); }catch(e){}
      setSyncStatus('synced');
    } else if(!bulkFlag){
      // No remote row yet and never bulk-applied locally: seed it, then push.
      TASKS.forEach(t=>{
        let shouldMark = false;
        if(t.chapter===1) shouldMark = true;
        else if(t.chapter===2 && ['A','B','C','D','E'].includes(t.part)) shouldMark = true;
        else if(t.chapter===2 && t.part==='F' && t.name==='Border Patrol 2') shouldMark = true;
        if(shouldMark){
          if(!state[t.id]) state[t.id]={done:false,flagged:false};
          state[t.id].done = true;
        }
      });
      try{ localStorage.setItem('gta5-tracker-bulk-ch2f-v1','applied'); }catch(e){}
      saveState();
    } else {
      setSyncStatus('synced');
    }
  }catch(e){
    console.error('initial sync failed', e);
    setSyncStatus(navigator.onLine ? 'error' : 'offline');
  }

  render();
}

function toggleDone(id){
  if(!state[id]) state[id]={done:false,flagged:false};
  state[id].done = !state[id].done;
  saveState(); render();
}
function toggleFlag(id){
  if(!state[id]) state[id]={done:false,flagged:false};
  state[id].flagged = !state[id].flagged;
  saveState(); render();
}
async function resetAll(){
  if(!confirm('Reset ALL progress? This clears every checkmark and flag.')) return;
  state = {};
  await saveState();
  render();
}

// ---------- RENDER ----------
function render(){
  const list = document.getElementById('chapterList');
  const emptyMsg = document.getElementById('emptyMsg');
  list.innerHTML = '';

  let totalDone=0, totalFlagged=0;
  const term = searchTerm.trim().toLowerCase();

  // group by chapter
  const chapters = [];
  const chapterMap = {};
  TASKS.forEach(t=>{
    if(!chapterMap[t.chapter]){
      chapterMap[t.chapter] = {num:t.chapter, title:t.chapterTitle, parts:{}, order:[]};
      chapters.push(chapterMap[t.chapter]);
    }
    const c = chapterMap[t.chapter];
    if(!c.parts[t.part]){ c.parts[t.part]=[]; c.order.push(t.part); }
    c.parts[t.part].push(t);
  });
  chapters.sort((a,b)=>a.num-b.num);

  let anyVisible=false;

  chapters.forEach(c=>{
    let chapterDone=0, chapterTotal=0;
    const partsHtml=[];

    c.order.forEach(partKey=>{
      const tasksInPart = c.parts[partKey];
      const rows=[];
      tasksInPart.forEach(t=>{
        const s = state[t.id]||{done:false,flagged:false};
        chapterTotal++;
        if(s.done) chapterDone++;
        if(s.done) totalDone++;
        if(s.flagged) totalFlagged++;

        // filter
        if(filterMode==='flagged' && !s.flagged) return;
        if(filterMode==='remaining' && s.done) return;
        if(term){
          const hay = (t.name+' '+t.loc+' '+t.note).toLowerCase();
          if(!hay.includes(term)) return;
        }
        anyVisible = true;

        rows.push(`
          <div class="task ${s.done?'done':''} ${s.flagged?'flagged':''}" data-id="${t.id}">
            <div class="check ${s.done?'on':''}" data-action="check" data-id="${t.id}">
              <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="task-main">
              <div class="task-name ${s.done?'done':''}">
                <span class="char-dot char-${t.ch}"></span>
                ${esc(t.name)}
                <span class="badge cat">${esc(t.cat)}</span>
                ${t.opt?'<span class="badge opt">Optional</span>':''}
              </div>
              <div class="task-loc">${esc(t.loc)}</div>
              ${t.note?`<div class="task-note">${esc(t.note)}</div>`:''}
            </div>
            <div class="flag-btn ${s.flagged?'on':''}" data-action="flag" data-id="${t.id}" title="Flag for later">&#9873;</div>
          </div>
        `);
      });
      if(rows.length){
        partsHtml.push(`<div class="part-block"><div class="part-label">Part ${partKey}</div>${rows.join('')}</div>`);
      }
    });

    if(partsHtml.length===0) return; // nothing visible in this chapter under current filter

    const pct = chapterTotal? Math.round(100*chapterDone/chapterTotal):0;
    const chapterEl = document.createElement('div');
    chapterEl.className='chapter';
    chapterEl.innerHTML = `
      <div class="chapter-head" data-toggle="${c.num}">
        <div>
          <div class="chapter-title"><span class="num">${c.num<=5?'CH '+c.num:'EPILOGUE'}</span>${esc(c.title)}</div>
          <div class="chapter-sub">${chapterDone} / ${chapterTotal} complete</div>
        </div>
        <div class="chapter-meta">
          <div class="chapter-bar"><div class="chapter-bar-inner" style="width:${pct}%"></div></div>
          <div class="chapter-count">${pct}%</div>
          <div class="chevron">&#9656;</div>
        </div>
      </div>
      <div class="chapter-body">${partsHtml.join('')}</div>
    `;
    if(openChapters.has(c.num)) chapterEl.classList.add('open');
    list.appendChild(chapterEl);
  });

  emptyMsg.style.display = anyVisible ? 'none':'block';

  const total = TASKS.length;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('progressBar').style.width = (total? (100*totalDone/total):0)+'%';
  document.getElementById('progressLabel').textContent = `${totalDone} / ${total} \u00b7 ${total?Math.round(100*totalDone/total):0}%`;
  document.getElementById('statDone').textContent = totalDone;
  document.getElementById('statFlagged').textContent = totalFlagged;
  document.getElementById('statRemain').textContent = total-totalDone;
}

function esc(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- EVENTS ----------
const openChapters = new Set();

document.addEventListener('click', (e)=>{
  const flagEl = e.target.closest('[data-action="flag"]');
  if(flagEl){ toggleFlag(flagEl.dataset.id); return; }
  const taskEl = e.target.closest('.task');
  if(taskEl){ toggleDone(taskEl.dataset.id); return; }
  const head = e.target.closest('[data-toggle]');
  if(head){
    const num = parseInt(head.dataset.toggle);
    const chapterEl = head.closest('.chapter');
    if(openChapters.has(num)){ openChapters.delete(num); chapterEl.classList.remove('open'); }
    else{ openChapters.add(num); chapterEl.classList.add('open'); }
    return;
  }
});

document.getElementById('searchBox').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  if(searchTerm.trim()){ TASKS.forEach(t=>openChapters.add(t.chapter)); }
  render();
});

function setFilter(mode){
  filterMode = mode;
  document.querySelectorAll('#filterAll,#filterFlagged,#filterRemaining').forEach(b=>b.classList.remove('active'));
  document.getElementById('filter'+mode.charAt(0).toUpperCase()+mode.slice(1)).classList.add('active');
  if(mode!=='all'){ TASKS.forEach(t=>openChapters.add(t.chapter)); }
  render();
}
document.getElementById('filterAll').addEventListener('click',()=>setFilter('all'));
document.getElementById('filterFlagged').addEventListener('click',()=>setFilter('flagged'));
document.getElementById('filterRemaining').addEventListener('click',()=>setFilter('remaining'));
document.getElementById('resetBtn').addEventListener('click', resetAll);
document.getElementById('syncNowBtn').addEventListener('click', syncNow);

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') syncNow();
});
window.addEventListener('focus', syncNow);

setFilter('all');
openChapters.add(1); // start with chapter 1 open
loadState();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.log('SW registration failed', e));
  });
}
</script>
</body>
</html>
